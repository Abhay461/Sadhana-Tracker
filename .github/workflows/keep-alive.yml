name: Render Keep Alive Ping

on:
  schedule:
    # Run every 10 minutes to prevent Render free tier from going to sleep
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Health Endpoint
        run: |
          echo "Pinging Render backend at $(date -u)"
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" --max-time 45 "https://sadhana-tracker-qq6m.onrender.com/api/v1/health")
          echo "$RESPONSE"
          echo "Keep-alive ping completed successfully!"
